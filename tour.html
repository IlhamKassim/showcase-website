<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Virtual Tour</title>

  <!-- Pannellum CSS & JS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #080818;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #panorama {
      width: 100%;
      height: 100%;
    }

    /* ── Scene Selector UI ── */
    #scene-nav {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(8,8,24,0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 10px 16px;
      max-width: calc(100vw - 40px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #scene-nav::-webkit-scrollbar { display: none; }
    .scene-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      color: #a0a0cc;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
      white-space: nowrap;
    }
    .scene-btn:hover,
    .scene-btn.active {
      background: linear-gradient(135deg, rgba(108,99,255,0.55), rgba(0,212,255,0.4));
      color: #fff;
      border-color: rgba(108,99,255,0.5);
    }

    /* Loading state */
    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080818;
      color: #a0a0cc;
      gap: 16px;
      font-size: 0.9rem;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(108,99,255,0.25);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <span>Loading panorama…</span>
  </div>

  <!-- Pannellum container -->
  <div id="panorama"></div>

  <!-- Scene navigation bar -->
  <div id="scene-nav">
    <button class="scene-btn active" data-scene="scene1">Display 1 — Lab Info Panel</button>
    <button class="scene-btn" data-scene="scene2">Display 2 — Cars &amp; Racing</button>
    <button class="scene-btn" data-scene="scene3">Display 3 — Mechanical Counter</button>
    <button class="scene-btn" data-scene="hallway1">Full Hallway Walkthrough</button>
  </div>

  <script>
    const sceneConfig = {
      default: {
        firstScene: 'scene1',
        sceneFadeDuration: 1000,
        autoLoad: true,
        showControls: true,
        compass: false,
        hfov: 110,
        minHfov: 50,
        maxHfov: 130,
        keyboardZoom: true,
        mouseZoom: true,
        hotSpotDebug: true,
      },
      scenes: {

        /* ── DISPLAY SCENES ─────────────────────────────────── */

        scene1: {
          title: 'Display 1 — Lab Information Panel',
          panorama: 'virtual-walkthrough-pic/display-1.JPG',
          hotSpots: [
            {
              // Display 1 orange panel sits at the far-left of the equirectangular
              pitch: 5, yaw: -150,
              type: 'info',
              text: 'Additive/Subtractive Manufacturing, Fluid Flow, Robotics & Energy panels',
            },
            {
              // Hallway continues right (deeper into building) toward Display 2
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Go to Display 2 — Cars & Racing',
              sceneId: 'scene2',
            },
          ],
        },

        scene2: {
          title: 'Display 2 — Cars & Racing',
          panorama: 'virtual-walkthrough-pic/display-2.JPG',
          hotSpots: [
            {
              // Hallway back toward entrance / Display 1 — left side of pano
              pitch: -10, yaw: -100,
              type: 'scene',
              text: 'Back to Display 1 — Lab Info Panel',
              sceneId: 'scene1',
            },
            {
              // Hallway continuing deeper toward Display 3 — right side of pano
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Go to Display 3 — Mechanical Counter',
              sceneId: 'scene3',
            },
            {
              // Display 2 case wraps both edges — almost directly behind default view
              pitch: 10, yaw: 175,
              type: 'info',
              text: '2025 Nittany Motorsports Formula 1 car — mounted with steel cables',
            },
          ],
        },

        scene3: {
          title: 'Display 3 — Mechanical Counter',
          panorama: 'virtual-walkthrough-pic/display-3.JPG',
          hotSpots: [
            {
              // Hallway back toward Display 2 — left side of pano (blue seating area)
              pitch: -10, yaw: -100,
              type: 'scene',
              text: 'Back to Display 2 — Cars & Racing',
              sceneId: 'scene2',
            },
            {
              // Orange wooden counter/display is right of center in the pano
              pitch: 5, yaw: 20,
              type: 'info',
              text: 'Hand-crank visitor counter — each digit represents a different technology era',
            },
            {
              // Hallway continuing past Display 3 — right side of pano
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Start Hallway Walkthrough',
              sceneId: 'hallway1',
            },
          ],
        },

        /* ── HALLWAY WALKTHROUGH ────────────────────────────── */
        /*
         * Images: virtual-walkthrough-pic/hallway-1.JPG … hallway-12.JPG
         * Yaw/pitch derived from visual analysis of each equirectangular:
         *   yaw  = ((x_pixel / 11904) − 0.5) × 360
         *   pitch = (0.5 − (y_pixel / 5952)) × 180
         * hotSpotDebug: true is enabled — open the browser console and
         * click anywhere in the panorama to log the exact yaw/pitch under
         * your cursor for fine-tuning.
         */

        hallway1: {
          title: 'Hallway — Stop 1 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-1.JPG',
          hotSpots: [
            {
              // Interior direction leads back toward Display 3 — far left of pano
              pitch: -10, yaw: -130,
              type: 'scene',
              text: 'Back to Display 3 — Mechanical Counter',
              sceneId: 'scene3',
            },
            {
              // Glass corridor transition doors sit dead-center — walk through them
              pitch: -10, yaw: 0,
              type: 'scene',
              text: 'Continue → Stop 2',
              sceneId: 'hallway2',
            },
          ],
        },

        hallway2: {
          title: 'Hallway — Stop 2 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-2.JPG',
          hotSpots: [
            {
              // Exit/glass doors visible at yaw ≈ -85° (center-left)
              pitch: -10, yaw: -85,
              type: 'scene',
              text: '← Back to Stop 1',
              sceneId: 'hallway1',
            },
            {
              // Hallway continues to the right past the Display 1 panel
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Continue → Stop 3',
              sceneId: 'hallway3',
            },
          ],
        },

        hallway3: {
          title: 'Hallway — Stop 3 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-3.JPG',
          hotSpots: [
            {
              // "Dept of ME" panel is left-center; back direction is just past it
              pitch: -10, yaw: -90,
              type: 'scene',
              text: '← Back to Stop 2',
              sceneId: 'hallway2',
            },
            {
              // Hallway continues to the right
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Continue → Stop 4',
              sceneId: 'hallway4',
            },
          ],
        },

        hallway4: {
          title: 'Hallway — Stop 4 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-4.JPG',
          hotSpots: [
            {
              // Exit doors visible far-left; back toward stop 3
              pitch: -10, yaw: -120,
              type: 'scene',
              text: '← Back to Stop 3',
              sceneId: 'hallway3',
            },
            {
              // Corridor continues past the blue kiosk units to the right
              pitch: -10, yaw: 80,
              type: 'scene',
              text: 'Continue → Stop 5',
              sceneId: 'hallway5',
            },
          ],
        },

        hallway5: {
          title: 'Hallway — Stop 5 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-5.JPG',
          hotSpots: [
            {
              // Green EXIT sign is at the far-left; back toward stop 4
              pitch: -10, yaw: -130,
              type: 'scene',
              text: '← Back to Stop 4',
              sceneId: 'hallway4',
            },
            {
              // Display 2 case (orange frame, dark panels) is far-right; continue past it
              pitch: -10, yaw: 120,
              type: 'scene',
              text: 'Continue → Stop 6',
              sceneId: 'hallway6',
            },
          ],
        },

        hallway6: {
          title: 'Hallway — Stop 6 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-6.JPG',
          hotSpots: [
            {
              // Portrait gallery is center-right; corridor back is to the left
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 5',
              sceneId: 'hallway5',
            },
            {
              // Hallway continues to the right past the gallery
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Continue → Stop 7',
              sceneId: 'hallway7',
            },
          ],
        },

        hallway7: {
          title: 'Hallway — Stop 7 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-7.JPG',
          hotSpots: [
            {
              // Blue seating on left; corridor back is further left
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 6',
              sceneId: 'hallway6',
            },
            {
              // Blue seating on right; corridor continues past it
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Continue → Stop 8',
              sceneId: 'hallway8',
            },
          ],
        },

        hallway8: {
          title: 'Hallway — Stop 8 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-8.JPG',
          hotSpots: [
            {
              // Corridor goes back to the left
              pitch: -10, yaw: -100,
              type: 'scene',
              text: '← Back to Stop 7',
              sceneId: 'hallway7',
            },
            {
              // Blue vertical blinds are far-right; continue past them
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Continue → Stop 9',
              sceneId: 'hallway9',
            },
          ],
        },

        hallway9: {
          title: 'Hallway — Stop 9 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-9.JPG',
          hotSpots: [
            {
              // Blue blinds are far-left (came from that direction)
              pitch: -10, yaw: -130,
              type: 'scene',
              text: '← Back to Stop 8',
              sceneId: 'hallway8',
            },
            {
              // QR-code TV is center-right; continue down the corridor
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Continue → Stop 10',
              sceneId: 'hallway10',
            },
          ],
        },

        hallway10: {
          title: 'Hallway — Stop 10 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-10.JPG',
          hotSpots: [
            {
              // Long corridor recedes to the left; that's where we came from
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 9',
              sceneId: 'hallway9',
            },
            {
              // Past the blue seating on the right — corridor continues
              pitch: -10, yaw: 130,
              type: 'scene',
              text: 'Continue → Stop 11',
              sceneId: 'hallway11',
            },
          ],
        },

        hallway11: {
          title: 'Hallway — Stop 11 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-11.JPG',
          hotSpots: [
            {
              // Corridor leading back to stop 10 is to the right
              pitch: -10, yaw: 100,
              type: 'scene',
              text: '← Back to Stop 10',
              sceneId: 'hallway10',
            },
            {
              // Stairwell/atrium opening is straight ahead (center of pano)
              pitch: -10, yaw: 10,
              type: 'scene',
              text: 'Continue → Stop 12',
              sceneId: 'hallway12',
            },
          ],
        },

        hallway12: {
          title: 'Hallway — Stop 12 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-12.JPG',
          hotSpots: [
            {
              // Corridor back to stop 11 recedes to the left
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 11',
              sceneId: 'hallway11',
            },
          ],
        },

      },
    };

    /* ── Determine start scene from URL param ── */
    const urlParams = new URLSearchParams(window.location.search);
    const startScene = urlParams.get('scene') || sceneConfig.default.firstScene;
    if (sceneConfig.scenes[startScene]) {
      sceneConfig.default.firstScene = startScene;
    }

    /* ── Init Pannellum ── */
    const viewer = pannellum.viewer('panorama', {
      ...sceneConfig.default,
      scenes: sceneConfig.scenes,
    });

    const loadingScreen = document.getElementById('loading-screen');

    viewer.on('load', () => {
      loadingScreen.classList.add('hidden');
      syncNavButtons(viewer.getScene());
    });

    viewer.on('scenechange', (sceneId) => {
      syncNavButtons(sceneId);
    });

    /* ── Scene nav button logic ── */
    document.querySelectorAll('.scene-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        viewer.loadScene(btn.dataset.scene);
      });
    });

    function syncNavButtons(activeScene) {
      document.querySelectorAll('.scene-btn').forEach(btn => {
        // Highlight "Full Hallway Walkthrough" for any hallway scene
        const btnScene = btn.dataset.scene;
        const isHallwayBtn = btnScene === 'hallway1';
        const isActiveHallway = activeScene.startsWith('hallway');
        btn.classList.toggle('active',
          isHallwayBtn ? isActiveHallway : btnScene === activeScene
        );
      });
    }
  </script>
</body>
</html>
