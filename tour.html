<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Virtual Tour</title>

  <!-- Pannellum CSS & JS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #080818;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #panorama {
      width: 100%;
      height: 100%;
    }

    /* ── Scene Selector UI ── */
    #scene-nav {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(8,8,24,0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 10px 16px;
      max-width: calc(100vw - 40px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #scene-nav::-webkit-scrollbar { display: none; }
    .scene-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      color: #a0a0cc;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
      white-space: nowrap;
    }
    .scene-btn:hover,
    .scene-btn.active {
      background: linear-gradient(135deg, rgba(108,99,255,0.55), rgba(0,212,255,0.4));
      color: #fff;
      border-color: rgba(108,99,255,0.5);
    }

    /* ── Loading screen ── */
    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080818;
      color: #a0a0cc;
      gap: 16px;
      font-size: 0.9rem;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(108,99,255,0.25);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Scene title overlay (top-center pill) ── */
    #scene-title {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(8,8,24,0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 30px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 20px;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      white-space: nowrap;
    }
    #scene-title.visible { opacity: 1; }

    /* ── Hallway stop badge (bottom-left) ── */
    #stop-badge {
      position: absolute;
      bottom: 72px;
      left: 20px;
      z-index: 100;
      background: rgba(8,8,24,0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(108,99,255,0.35);
      border-radius: 20px;
      color: #a0a0cc;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 14px;
      letter-spacing: 0.03em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #stop-badge.visible { opacity: 1; }

    /* ── Fullscreen button (top-right) ── */
    #fullscreen-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(8,8,24,0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #a0a0cc;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      padding: 0;
    }
    #fullscreen-btn:hover { background: rgba(108,99,255,0.4); color: #fff; }
    #fullscreen-btn svg { display: block; }

    /* ── Prev / Next hallway arrows (sides, vertically centered) ── */
    #hallway-nav {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      pointer-events: none;   /* container transparent to mouse */
    }
    .hall-btn {
      background: rgba(8,8,24,0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      color: #a0a0cc;
      font-size: 1.6rem;
      line-height: 1;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: all;    /* re-enable for buttons */
      user-select: none;
      opacity: 0;
      transition: background 0.2s, color 0.2s, opacity 0.3s;
    }
    .hall-btn.visible { opacity: 1; }
    .hall-btn:hover { background: rgba(108,99,255,0.45); color: #fff; }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <span id="loading-msg">Loading panorama…</span>
  </div>

  <!-- Pannellum container -->
  <div id="panorama"></div>

  <!-- Scene title overlay -->
  <div id="scene-title"></div>

  <!-- Hallway stop badge -->
  <div id="stop-badge"></div>

  <!-- Fullscreen button (Feather Icons: maximize / minimize) -->
  <button id="fullscreen-btn" title="Enter fullscreen">
    <svg id="fs-expand" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"></polyline>
      <polyline points="9 21 3 21 3 15"></polyline>
      <line x1="21" y1="3" x2="14" y2="10"></line>
      <line x1="3"  y1="21" x2="10" y2="14"></line>
    </svg>
    <svg id="fs-compress" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         style="display:none">
      <polyline points="4 14 10 14 10 20"></polyline>
      <polyline points="20 10 14 10 14 4"></polyline>
      <line x1="10" y1="14" x2="3"  y2="21"></line>
      <line x1="21" y1="3"  x2="14" y2="10"></line>
    </svg>
  </button>

  <!-- Prev / Next hallway arrows -->
  <div id="hallway-nav">
    <button class="hall-btn" id="hall-prev" title="Previous stop">&#8249;</button>
    <button class="hall-btn" id="hall-next" title="Next stop">&#8250;</button>
  </div>

  <!-- Scene navigation bar -->
  <div id="scene-nav">
    <button class="scene-btn active" data-scene="scene1">Display 1 — Lab Info Panel</button>
    <button class="scene-btn" data-scene="scene2">Display 2 — Cars &amp; Racing</button>
    <button class="scene-btn" data-scene="scene3">Display 3 — Mechanical Counter</button>
    <button class="scene-btn" data-scene="hallway1">Full Hallway Walkthrough</button>
  </div>

  <script>
    /* ── Constants ── */
    const HALLWAY_COUNT = 7;

    const PANORAMAS = {
      scene1:    'display-1-picture/display-1-1.JPG',
      scene1b:   'display-1-picture/display-1-2.JPG',
      scene2:    'display-2-picture/display-2.JPG',
      scene3:    'display-3-picture/display-3-1.JPG',
      scene3b:   'display-3-picture/display-3-2.JPG',
      hallway1: 'virtual-walkthrough-pic/1.JPG',
      hallway2: 'virtual-walkthrough-pic/2.JPG',
      hallway3: 'virtual-walkthrough-pic/3.JPG',
      hallway4: 'virtual-walkthrough-pic/4.JPG',
      hallway5: 'virtual-walkthrough-pic/5.JPG',
      hallway6: 'virtual-walkthrough-pic/6.JPG',
      hallway7: 'virtual-walkthrough-pic/7.JPG',
    };

    const HALLWAY_ORDER = Array.from({ length: HALLWAY_COUNT }, (_, i) => `hallway${i + 1}`);

    /* ── Pannellum config ── */
    const sceneConfig = {
      default: {
        firstScene: 'scene1',
        sceneFadeDuration: 1000,
        autoLoad: true,
        showControls: true,
        compass: false,
        hfov: 110,
        minHfov: 50,
        maxHfov: 130,
        keyboardZoom: true,
        mouseZoom: true,
        hotSpotDebug: false,
        autoRotate: -2,
        autoRotateInactivityDelay: 4000,
        autoRotateStopDelay: 2000,
      },
      scenes: {

        /* ── DISPLAY SCENES ─────────────────────────────────── */

        scene1: {
          title: 'Display 1 — Lab Information Panel',
          panorama: 'display-1-picture/display-1-1.JPG',
          yaw: 0,
          hotSpots: [
            {
              pitch: 5, yaw: -150,
              type: 'info',
              text: 'Additive/Subtractive Manufacturing, Fluid Flow, Robotics & Energy panels',
            },
            {
              pitch: -10, yaw: 20,
              type: 'scene',
              text: 'Display 1 — View 2 →',
              sceneId: 'scene1b',
            },
            {
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Go to Display 2 — Cars & Racing',
              sceneId: 'scene2',
            },
          ],
        },

        scene1b: {
          title: 'Display 1 — Lab Information Panel (View 2)',
          panorama: 'display-1-picture/display-1-2.JPG',
          yaw: 0,
          hotSpots: [
            {
              pitch: -10, yaw: 90,
              type: 'scene',
              text: '← View 1',
              sceneId: 'scene1',
            },
            {
              pitch: -10, yaw: -90,
              type: 'scene',
              text: 'Go to Display 2 — Cars & Racing',
              sceneId: 'scene2',
            },
          ],
        },

        scene2: {
          title: 'Display 2 — Cars & Racing',
          panorama: 'display-2-picture/display-2.JPG',
          yaw: 0,
          hotSpots: [
            {
              pitch: -10, yaw: 113,
              type: 'scene',
              text: 'Back to Display 1 — Lab Info Panel',
              sceneId: 'scene1',
            },
            {
              pitch: -10, yaw: -87,
              type: 'scene',
              text: 'Go to Display 3 — Mechanical Counter',
              sceneId: 'scene3',
            },
            {
              pitch: 10, yaw: -5,
              type: 'info',
              text: '2025 Nittany Motorsports Formula SAE car, mounted with steel cables',
            },
          ],
        },

        scene3: {
          title: 'Display 3 — Mechanical Counter',
          panorama: 'display-3-picture/display-3-1.JPG',
          yaw: 0,
          hotSpots: [
            {
              pitch: -10, yaw: -100,
              type: 'scene',
              text: 'Back to Display 2 — Cars & Racing',
              sceneId: 'scene2',
            },
            {
              pitch: 5, yaw: 20,
              type: 'info',
              text: 'Hand-crank visitor counter — each digit represents a different technology era',
            },
            {
              pitch: -10, yaw: 55,
              type: 'scene',
              text: 'Display 3 — View 2 →',
              sceneId: 'scene3b',
            },
            {
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Start Hallway Walkthrough',
              sceneId: 'hallway1',
              targetYaw: 0,
            },
          ],
        },

        scene3b: {
          title: 'Display 3 — Mechanical Counter (View 2)',
          panorama: 'display-3-picture/display-3-2.JPG',
          yaw: 0,
          hotSpots: [
            {
              pitch: -10, yaw: -100,
              type: 'scene',
              text: '← View 1',
              sceneId: 'scene3',
            },
            {
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Start Hallway Walkthrough',
              sceneId: 'hallway1',
              targetYaw: -155,
            },
          ],
        },

        /* ── HALLWAY WALKTHROUGH ────────────────────────────── */
        /*
         * Each scene has a `yaw` property so the initial view faces "forward"
         * (deeper into the building, toward the atrium).
         * Transition hotspots use `targetYaw` so you arrive in the next/previous
         * scene already oriented in the direction of travel.
         */

        hallway1: {
          title: 'Hallway — Stop 1 of 7',
          panorama: 'virtual-walkthrough-pic/1.JPG',
          yaw: -134,
          hotSpots: [
            {
              pitch: -10, yaw: 46,
              type: 'scene',
              text: '← Back to Display 3 — Mechanical Counter',
              sceneId: 'scene3',
            },
            {
              pitch: -10, yaw: -134,
              type: 'scene',
              text: 'Continue → Stop 2',
              sceneId: 'hallway2',
              targetYaw: -97,
            },
          ],
        },

        hallway2: {
          title: 'Hallway — Stop 2 of 7',
          panorama: 'virtual-walkthrough-pic/2.JPG',
          yaw: -97,
          hotSpots: [
            {
              pitch: -10, yaw: 83,
              type: 'scene',
              text: '← Back to Stop 1',
              sceneId: 'hallway1',
              targetYaw: -134,
            },
            {
              pitch: -10, yaw: -97,
              type: 'scene',
              text: 'Continue → Stop 3',
              sceneId: 'hallway3',
              targetYaw: -131,
            },
          ],
        },

        hallway3: {
          title: 'Hallway — Stop 3 of 7',
          panorama: 'virtual-walkthrough-pic/3.JPG',
          yaw: -131,
          hotSpots: [
            {
              pitch: -10, yaw: 151,
              type: 'scene',
              text: '← Back to Stop 2',
              sceneId: 'hallway2',
              targetYaw: -97,
            },
            {
              pitch: -10, yaw: -131,
              type: 'scene',
              text: 'Continue → Stop 4',
              sceneId: 'hallway4',
              targetYaw: -90,
            },
          ],
        },

        hallway4: {
          title: 'Hallway — Stop 4 of 7',
          panorama: 'virtual-walkthrough-pic/4.JPG',
          yaw: -90,
          hotSpots: [
            {
              pitch: -10, yaw: 97,
              type: 'scene',
              text: '← Back to Stop 3',
              sceneId: 'hallway3',
              targetYaw: -131,
            },
            {
              pitch: -10, yaw: -90,
              type: 'scene',
              text: 'Continue → Stop 5',
              sceneId: 'hallway5',
              targetYaw: 0,
            },
          ],
        },

        hallway5: {
          title: 'Hallway — Stop 5 of 7',
          panorama: 'virtual-walkthrough-pic/5.JPG',
          yaw: 0,
          hotSpots: [
            {
              pitch: -10, yaw: -172,
              type: 'scene',
              text: '← Back to Stop 4',
              sceneId: 'hallway4',
              targetYaw: -90,
            },
            {
              pitch: -10, yaw: 0,
              type: 'scene',
              text: 'Continue → Stop 6',
              sceneId: 'hallway6',
              targetYaw: 0,
            },
          ],
        },

        hallway6: {
          title: 'Hallway — Stop 6 of 7',
          panorama: 'virtual-walkthrough-pic/6.JPG',
          yaw: 0,
          hotSpots: [
            {
              pitch: -10, yaw: -95,
              type: 'scene',
              text: '← Back to Stop 5',
              sceneId: 'hallway5',
              targetYaw: 0,
            },
            {
              pitch: -10, yaw: 82,
              type: 'scene',
              text: 'Continue → Stop 7',
              sceneId: 'hallway7',
              targetYaw: 46,
            },
          ],
        },

        hallway7: {
          title: 'Hallway — Stop 7 of 7',
          panorama: 'virtual-walkthrough-pic/7.JPG',
          yaw: 46,
          hotSpots: [
            {
              pitch: -10, yaw: -127,
              type: 'scene',
              text: '← Back to Stop 6',
              sceneId: 'hallway6',
              targetYaw: 82,
            },
          ],
        },

      },
    };

    /* ── URL param: override start scene ── */
    const urlParams = new URLSearchParams(window.location.search);
    const startScene = urlParams.get('scene') || sceneConfig.default.firstScene;
    if (sceneConfig.scenes[startScene]) {
      sceneConfig.default.firstScene = startScene;
    }

    /* ── Init Pannellum ── */
    const viewer = pannellum.viewer('panorama', {
      ...sceneConfig.default,
      scenes: sceneConfig.scenes,
    });

    /* ── DOM refs ── */
    const loadingScreen = document.getElementById('loading-screen');
    const loadingMsg    = document.getElementById('loading-msg');
    const sceneTitle    = document.getElementById('scene-title');
    const stopBadge     = document.getElementById('stop-badge');
    const hallPrev      = document.getElementById('hall-prev');
    const hallNext      = document.getElementById('hall-next');
    const fsExpand      = document.getElementById('fs-expand');
    const fsCompress    = document.getElementById('fs-compress');

    /* ── Preload helper ── */
    const _preloaded = new Set();
    function preload(src) {
      if (!src || _preloaded.has(src)) return;
      _preloaded.add(src);
      const img = new Image();
      img.src = src;
    }

    /* ── Hallway prev/next adjacency ── */
    function getAdjacentHallway(sceneId) {
      const idx = HALLWAY_ORDER.indexOf(sceneId);
      return {
        prev: idx > 0 ? HALLWAY_ORDER[idx - 1] : null,
        next: idx >= 0 && idx < HALLWAY_ORDER.length - 1 ? HALLWAY_ORDER[idx + 1] : null,
      };
    }

    /* ── Update all UI for the active scene ── */
    function updateUI(sceneId) {
      const title = sceneConfig.scenes[sceneId]?.title ?? '';

      // Scene title pill
      sceneTitle.textContent = title;
      sceneTitle.classList.add('visible');

      const isHallway = sceneId.startsWith('hallway');

      // Stop badge — hallway only
      if (isHallway) {
        const stopNum = parseInt(sceneId.replace('hallway', ''), 10);
        stopBadge.textContent = `● Stop ${stopNum} / ${HALLWAY_COUNT}`;
        stopBadge.classList.add('visible');
      } else {
        stopBadge.classList.remove('visible');
      }

      // Prev / Next arrows — hallway only, hide if no target
      if (isHallway) {
        const { prev, next } = getAdjacentHallway(sceneId);
        hallPrev._target = prev;
        hallNext._target = next;
        hallPrev.classList.toggle('visible', !!prev);
        hallNext.classList.toggle('visible', !!next);
      } else {
        hallPrev.classList.remove('visible');
        hallNext.classList.remove('visible');
      }

      // Nav bar highlight
      syncNavButtons(sceneId);

      // Preload adjacent hallway panoramas
      const adj = getAdjacentHallway(sceneId);
      if (adj.next) preload(PANORAMAS[adj.next]);
      if (adj.prev) preload(PANORAMAS[adj.prev]);
    }

    /* ── Loading screen helpers ── */
    let firstLoad = true;

    function showLoading(msg) {
      loadingMsg.textContent = msg;
      loadingScreen.classList.remove('hidden');
    }
    function hideLoading() {
      loadingScreen.classList.add('hidden');
    }

    /* ── Viewer events ── */
    viewer.on('load', () => {
      hideLoading();
      updateUI(viewer.getScene());
      firstLoad = false;
    });

    viewer.on('scenechange', (sceneId) => {
      updateUI(sceneId);
    });

    viewer.on('error', () => {
      loadingMsg.textContent = 'Could not load panorama — check your connection and try again.';
      loadingScreen.classList.remove('hidden');
    });

    /* ── Scene nav buttons ── */
    document.querySelectorAll('.scene-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.scene;
        if (!firstLoad) {
          showLoading(`Loading ${sceneConfig.scenes[id]?.title ?? id}…`);
        }
        viewer.loadScene(id);
      });
    });

    /* ── Prev / Next hallway arrows ── */
    hallPrev.addEventListener('click', () => {
      const id = hallPrev._target;
      if (!id) return;
      showLoading(`Loading ${sceneConfig.scenes[id]?.title ?? id}…`);
      viewer.loadScene(id);
    });
    hallNext.addEventListener('click', () => {
      const id = hallNext._target;
      if (!id) return;
      showLoading(`Loading ${sceneConfig.scenes[id]?.title ?? id}…`);
      viewer.loadScene(id);
    });

    /* ── Fullscreen toggle ── */
    const fsBtn = document.getElementById('fullscreen-btn');
    function syncFsIcon() {
      const isFs = !!document.fullscreenElement;
      fsExpand.style.display   = isFs ? 'none'  : 'block';
      fsCompress.style.display = isFs ? 'block' : 'none';
      fsBtn.title = isFs ? 'Exit fullscreen' : 'Enter fullscreen';
    }
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
    document.addEventListener('fullscreenchange', syncFsIcon);

    /* ── Nav bar highlight sync ── */
    function syncNavButtons(activeScene) {
      // Map sub-scenes to their parent nav button
      const sceneAlias = { scene1b: 'scene1', scene3b: 'scene3' };
      const effectiveScene = sceneAlias[activeScene] ?? activeScene;
      document.querySelectorAll('.scene-btn').forEach(btn => {
        const btnScene = btn.dataset.scene;
        const isHallwayBtn    = btnScene === 'hallway1';
        const isActiveHallway = activeScene.startsWith('hallway');
        btn.classList.toggle('active',
          isHallwayBtn ? isActiveHallway : btnScene === effectiveScene
        );
      });
    }
  </script>
</body>
</html>
