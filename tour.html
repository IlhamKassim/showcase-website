<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Virtual Tour</title>

  <!-- Pannellum CSS & JS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #080818;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    #panorama {
      width: 100%;
      height: 100%;
    }

    /* ── Scene Selector UI ── */
    #scene-nav {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(8,8,24,0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 10px 16px;
      max-width: calc(100vw - 40px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    #scene-nav::-webkit-scrollbar { display: none; }
    .scene-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      color: #a0a0cc;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
      white-space: nowrap;
    }
    .scene-btn:hover,
    .scene-btn.active {
      background: linear-gradient(135deg, rgba(108,99,255,0.55), rgba(0,212,255,0.4));
      color: #fff;
      border-color: rgba(108,99,255,0.5);
    }

    /* Loading state */
    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080818;
      color: #a0a0cc;
      gap: 16px;
      font-size: 0.9rem;
      transition: opacity 0.5s ease;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(108,99,255,0.25);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <span>Loading panorama…</span>
  </div>

  <!-- Pannellum container -->
  <div id="panorama"></div>

  <!-- Scene navigation bar -->
  <div id="scene-nav">
    <button class="scene-btn active" data-scene="scene1">Display 1 — Lab Info Panel</button>
    <button class="scene-btn" data-scene="scene2">Display 2 — Cars &amp; Racing</button>
    <button class="scene-btn" data-scene="scene3">Display 3 — Mechanical Counter</button>
    <button class="scene-btn" data-scene="hallway1">Full Hallway Walkthrough</button>
  </div>

  <script>
    const sceneConfig = {
      default: {
        firstScene: 'scene1',
        sceneFadeDuration: 1000,
        autoLoad: true,
        showControls: true,
        compass: false,
        hfov: 110,
        minHfov: 50,
        maxHfov: 130,
        keyboardZoom: true,
        mouseZoom: true,
        hotSpotDebug: true,
      },
      scenes: {

        /* ── DISPLAY SCENES ─────────────────────────────────── */

        scene1: {
          title: 'Display 1 — Lab Information Panel',
          panorama: 'virtual-walkthrough-pic/display-1.JPG',
          hotSpots: [
            {
              pitch: 5, yaw: -150,
              type: 'info',
              text: 'Additive/Subtractive Manufacturing, Fluid Flow, Robotics & Energy panels',
            },
            {
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Go to Display 2 — Cars & Racing',
              sceneId: 'scene2',
            },
          ],
        },

        scene2: {
          title: 'Display 2 — Cars & Racing',
          panorama: 'virtual-walkthrough-pic/display-2.JPG',
          hotSpots: [
            {
              pitch: -10, yaw: -100,
              type: 'scene',
              text: 'Back to Display 1 — Lab Info Panel',
              sceneId: 'scene1',
            },
            {
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Go to Display 3 — Mechanical Counter',
              sceneId: 'scene3',
            },
            {
              pitch: 10, yaw: 175,
              type: 'info',
              text: '2025 Nittany Motorsports Formula 1 car — mounted with steel cables',
            },
          ],
        },

        scene3: {
          title: 'Display 3 — Mechanical Counter',
          panorama: 'virtual-walkthrough-pic/display-3.JPG',
          hotSpots: [
            {
              pitch: -10, yaw: -100,
              type: 'scene',
              text: 'Back to Display 2 — Cars & Racing',
              sceneId: 'scene2',
            },
            {
              pitch: 5, yaw: 20,
              type: 'info',
              text: 'Hand-crank visitor counter — each digit represents a different technology era',
            },
            {
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Start Hallway Walkthrough',
              sceneId: 'hallway1',
              targetYaw: -155,  // arrive at Stop 1 already facing into the building
            },
          ],
        },

        /* ── HALLWAY WALKTHROUGH ────────────────────────────── */
        /*
         * Each scene has a `yaw` property so the initial view faces "forward"
         * (deeper into the building, toward the atrium).
         * Transition hotspots use `targetYaw` so you arrive in the next/previous
         * scene already oriented in the direction of travel.
         *
         * hotSpotDebug: true is still enabled — click anywhere in the panorama
         * and the exact yaw/pitch is logged to the browser console for fine-tuning.
         */

        hallway1: {
          title: 'Hallway — Stop 1 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-1.JPG',
          yaw: -155,  // face interior corridor (entrance doors are at yaw=0 behind you)
          hotSpots: [
            {
              // Back toward Display 3 — same interior direction, offset slightly
              pitch: -10, yaw: -130,
              type: 'scene',
              text: 'Back to Display 3 — Mechanical Counter',
              sceneId: 'scene3',
            },
            {
              // FIX: was yaw=0 (entrance doors). Interior corridor is at far-left.
              pitch: -10, yaw: -155,
              type: 'scene',
              text: 'Continue → Stop 2',
              sceneId: 'hallway2',
              targetYaw: 140,  // arrive at Stop 2 facing the deep corridor (far-right)
            },
          ],
        },

        hallway2: {
          title: 'Hallway — Stop 2 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-2.JPG',
          yaw: 140,  // face deep corridor on arrival (forward direction)
          hotSpots: [
            {
              // Exit/glass doors at center-left — back toward entrance
              pitch: -10, yaw: -85,
              type: 'scene',
              text: '← Back to Stop 1',
              sceneId: 'hallway1',
              targetYaw: -155,  // arrive at Stop 1 facing the interior corridor
            },
            {
              // Corridor continues far-right past Display 1 panel
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Continue → Stop 3',
              sceneId: 'hallway3',
              targetYaw: 90,  // arrive at Stop 3 facing the right corridor
            },
          ],
        },

        hallway3: {
          title: 'Hallway — Stop 3 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-3.JPG',
          yaw: 90,  // face right corridor (forward direction)
          hotSpots: [
            {
              // "Dept of ME" panel is left-center; back direction past it
              pitch: -10, yaw: -90,
              type: 'scene',
              text: '← Back to Stop 2',
              sceneId: 'hallway2',
              targetYaw: 140,  // arrive at Stop 2 facing forward
            },
            {
              // Corridor continues to the right
              pitch: -10, yaw: 90,
              type: 'scene',
              text: 'Continue → Stop 4',
              sceneId: 'hallway4',
              targetYaw: 10,  // arrive at Stop 4 facing the center corridor
            },
          ],
        },

        hallway4: {
          title: 'Hallway — Stop 4 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-4.JPG',
          yaw: 10,  // face center corridor (forward direction)
          hotSpots: [
            {
              // FIX: was yaw=-120 (classroom door). Far-left corridor is the back direction.
              pitch: -10, yaw: -160,
              type: 'scene',
              text: '← Back to Stop 3',
              sceneId: 'hallway3',
              targetYaw: 90,  // arrive at Stop 3 facing forward
            },
            {
              // Corridor continues past the blue kiosk units to the right
              pitch: -10, yaw: 80,
              type: 'scene',
              text: 'Continue → Stop 5',
              sceneId: 'hallway5',
              targetYaw: 120,  // arrive at Stop 5 facing toward Display 2
            },
          ],
        },

        hallway5: {
          title: 'Hallway — Stop 5 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-5.JPG',
          yaw: 82.35209261967027,  // face toward Display 2 case (forward direction)
          hotSpots: [
            {
              // Green EXIT sign at far-left — back toward entrance
              pitch: -10, yaw: -130,
              type: 'scene',
              text: '← Back to Stop 4',
              sceneId: 'hallway4',
              targetYaw: 10,  // arrive at Stop 4 facing the center corridor
            },
            {
              // Corridor continues past Display 2 case (far-right)
              pitch: -10, yaw: 120,
              type: 'scene',
              text: 'Continue → Stop 6',
              sceneId: 'hallway6',
              targetYaw: 100,  // arrive at Stop 6 facing past portrait gallery
            },
          ],
        },

        hallway6: {
          title: 'Hallway — Stop 6 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-6.JPG',
          yaw: 100,  // face corridor past portrait gallery (forward direction)
          hotSpots: [
            {
              // Corridor back is to the left (came past Display 2)
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 5',
              sceneId: 'hallway5',
              targetYaw: 120,  // arrive at Stop 5 facing forward
            },
            {
              // Hallway continues to the right past the gallery
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Continue → Stop 7',
              sceneId: 'hallway7',
              targetYaw: 130,  // arrive at Stop 7 facing corridor past seating
            },
          ],
        },

        hallway7: {
          title: 'Hallway — Stop 7 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-7.JPG',
          yaw: 81.34864434206035,  // face corridor opening past blue seating (forward direction)
          hotSpots: [
            {
              // Mailbox corridor at far-left — back toward entrance
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 6',
              sceneId: 'hallway6',
              targetYaw: 100,  // arrive at Stop 6 facing forward
            },
            {
              // FIX: was yaw=90 (seating benches). Corridor opening is far-right.
              pitch: -10, yaw: 130,
              type: 'scene',
              text: 'Continue → Stop 8',
              sceneId: 'hallway8',
              targetYaw: 130,  // arrive at Stop 8 facing corridor past blinds
            },
          ],
        },

        hallway8: {
          title: 'Hallway — Stop 8 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-8.JPG',
          yaw: 100.42214043944256,  // face corridor past blue blinds (forward direction)
          hotSpots: [
            {
              // Corridor recedes to the left
              pitch: -10, yaw: -100,
              type: 'scene',
              text: '← Back to Stop 7',
              sceneId: 'hallway7',
              targetYaw: 130,  // arrive at Stop 7 facing forward
            },
            {
              // Blue vertical blinds at far-right; continue past them
              pitch: -10, yaw: 130,
              type: 'scene',
              text: 'Continue → Stop 9',
              sceneId: 'hallway9',
              targetYaw: 100,  // arrive at Stop 9 facing corridor past QR TV
            },
          ],
        },

        hallway9: {
          title: 'Hallway — Stop 9 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-9.JPG',
          yaw: 59.52777603348975,  // face corridor past QR-code TV (forward direction)
          hotSpots: [
            {
              // Blue blinds at far-left (came from that direction)
              pitch: -10, yaw: -130,
              type: 'scene',
              text: '← Back to Stop 8',
              sceneId: 'hallway8',
              targetYaw: 130,  // arrive at Stop 8 facing forward
            },
            {
              // Continue down the corridor past the QR-code TV
              pitch: -10, yaw: 100,
              type: 'scene',
              text: 'Continue → Stop 10',
              sceneId: 'hallway10',
              targetYaw: 120,  // arrive at Stop 10 facing corridor past large doors
            },
          ],
        },

        hallway10: {
          title: 'Hallway — Stop 10 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-10.JPG',
          yaw: 74.17911683199284,  // face corridor past large doors and display panel (forward direction)
          hotSpots: [
            {
              // Long corridor recedes to the left — that's where we came from
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 9',
              sceneId: 'hallway9',
              targetYaw: 100,  // arrive at Stop 9 facing forward
            },
            {
              // Corridor continues past the display panel on the right
              pitch: -10, yaw: 130,
              type: 'scene',
              text: 'Continue → Stop 11',
              sceneId: 'hallway11',
              targetYaw: 10,  // arrive at Stop 11 facing toward the atrium
            },
          ],
        },

        hallway11: {
          title: 'Hallway — Stop 11 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-11.JPG',
          yaw: 23.937516502483668,  // face toward the atrium opening (forward direction)
          hotSpots: [
            {
              // FIX: was yaw=100 (completely wrong side). Far-left corridor is the back direction.
              pitch: -10, yaw: -150,
              type: 'scene',
              text: '← Back to Stop 10',
              sceneId: 'hallway10',
              targetYaw: 120,  // arrive at Stop 10 facing forward
            },
            {
              // Atrium/stairwell opening ahead (center of panorama)
              pitch: -10, yaw: 10,
              type: 'scene',
              text: 'Continue → Stop 12',
              sceneId: 'hallway12',
              targetYaw: 0,  // arrive at Stop 12 facing the atrium
            },
          ],
        },

        hallway12: {
          title: 'Hallway — Stop 12 of 12',
          panorama: 'virtual-walkthrough-pic/hallway-12.JPG',
          yaw: 0,  // face the atrium (the final destination)
          hotSpots: [
            {
              // Corridor back to stop 11 recedes to the left
              pitch: -10, yaw: -110,
              type: 'scene',
              text: '← Back to Stop 11',
              sceneId: 'hallway11',
              targetYaw: 10,  // arrive at Stop 11 facing forward (toward atrium)
            },
          ],
        },

      },
    };

    /* ── Determine start scene from URL param ── */
    const urlParams = new URLSearchParams(window.location.search);
    const startScene = urlParams.get('scene') || sceneConfig.default.firstScene;
    if (sceneConfig.scenes[startScene]) {
      sceneConfig.default.firstScene = startScene;
    }

    /* ── Init Pannellum ── */
    const viewer = pannellum.viewer('panorama', {
      ...sceneConfig.default,
      scenes: sceneConfig.scenes,
    });

    const loadingScreen = document.getElementById('loading-screen');

    viewer.on('load', () => {
      loadingScreen.classList.add('hidden');
      syncNavButtons(viewer.getScene());
    });

    viewer.on('scenechange', (sceneId) => {
      syncNavButtons(sceneId);
    });

    /* ── Scene nav button logic ── */
    document.querySelectorAll('.scene-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        viewer.loadScene(btn.dataset.scene);
      });
    });

    function syncNavButtons(activeScene) {
      document.querySelectorAll('.scene-btn').forEach(btn => {
        // Highlight "Full Hallway Walkthrough" for any hallway scene
        const btnScene = btn.dataset.scene;
        const isHallwayBtn = btnScene === 'hallway1';
        const isActiveHallway = activeScene.startsWith('hallway');
        btn.classList.toggle('active',
          isHallwayBtn ? isActiveHallway : btnScene === activeScene
        );
      });
    }
  </script>
</body>
</html>
